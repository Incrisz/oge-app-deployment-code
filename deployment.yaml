apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-app
  namespace: oge-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: argo-app
  template:
    metadata:
      labels:
        app: argo-app
    spec:
      containers:
        - name: web
          image: incriszz/month5:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
